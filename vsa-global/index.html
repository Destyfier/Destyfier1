<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <title>Visa & Study Alliance Global | Study Abroad & Visa Consultants, Chitwan</title>
    <meta name="description" content="Visa & Study Alliance Global — expert study abroad and visa guidance in Bharatpur, Chitwan. Free counselling, IELTS/PTE prep, university admissions, scholarships and visa documentation for Australia, USA, Canada, UK and more." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Static Netlify Forms detection.
      Netlify scans the built HTML (not the JS bundle) for a form tag with
      data-netlify="true" to register the form endpoint. This hidden form's
      field names must mirror the React forms' field names exactly. The real
      forms the user interacts with are rendered by React and submit to this
      same endpoint via fetch — see Hero.jsx and ConsultationCTA.jsx.
    -->
    <form name="consultation" data-netlify="true" netlify-honeypot="company" hidden>
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <input type="text" name="destination" />
      <input type="text" name="intakeYear" />
      <input type="text" name="intakeQuarter" />
      <textarea name="message"></textarea>
      <input type="text" name="company" />
    </form>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
